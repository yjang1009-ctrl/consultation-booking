<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학부모 상담 예약</title>
<script>
window.addEventListener('error', function (e) {
  var msg = e.message ? e.message : (e.target && e.target.src ? '리소스를 불러오지 못했어요: ' + e.target.src : '알 수 없는 오류');
  var box = document.createElement('pre');
  box.style.cssText = 'white-space:pre-wrap;word-break:break-word;padding:20px;color:#b23a3a;font-size:13px;line-height:1.6;font-family:monospace;background:#fff;';
  box.textContent = '오류: ' + msg + (e.filename ? ('\n위치: ' + e.filename + ':' + e.lineno) : '');
  document.body.prepend(box);
}, true);
window.addEventListener('unhandledrejection', function (e) {
  var box = document.createElement('pre');
  box.style.cssText = 'white-space:pre-wrap;word-break:break-word;padding:20px;color:#b23a3a;font-size:13px;line-height:1.6;font-family:monospace;background:#fff;';
  box.textContent = '오류(Promise): ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
  document.body.prepend(box);
});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script crossorigin src="https://unpkg.com/@supabase/supabase-js@2.45.3/dist/umd/supabase.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
try {

// ============================================================
// ⚠️ 여기 두 줄만 본인 Supabase 프로젝트 값으로 바꿔주세요.
// Supabase 대시보드 > Project Settings > API 에서 확인 가능합니다.
// ============================================================
const SUPABASE_URL = "https://lbuzrybiraresjvxacpv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidXpyeWJpcmFyZXNqdnhhY3B2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTE0NDgsImV4cCI6MjEwMjM2NzQ0OH0.ecK1irhHl7mhEUgXVkP3w5TmlWS853OIM_MQ5xoTI2A";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const { useState, useEffect, useCallback } = React;

// ---------- 상수 ----------
const HOURS = [9, 10, 11, 12, 13, 14, 15, 16];
const AVAILABLE_HOURS = HOURS.filter((h) => h < 11 || h >= 13);
const WEEKDAY_LABEL = ["일", "월", "화", "수", "목", "금", "토"];

function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function timeLabel(h) { return `${pad(h)}:00 ~ ${pad(h)}:30`; }

async function fetchAvailability(dKey) {
  const [{ data: booked, error: e1 }, { data: closed, error: e2 }] = await Promise.all([
    supabase.from("booking_slots").select("hour").eq("date", dKey),
    supabase.from("closed_slots").select("hour").eq("date", dKey),
  ]);
  if (e1 || e2) return { bookedHours: [], closedHours: [], error: true };
  return { bookedHours: (booked || []).map((r) => r.hour), closedHours: (closed || []).map((r) => r.hour), error: false };
}

// ---------- 재사용 달력 ----------
function MiniCalendar({ viewMonth, setViewMonth, selectedDate, onSelectDate, minDate, maxDate }) {
  function isSelectableDay(d) {
    if (d < minDate || d > maxDate) return false;
    const day = d.getDay();
    return day !== 0 && day !== 6;
  }
  function buildCalendarCells() {
    const year = viewMonth.getFullYear();
    const month = viewMonth.getMonth();
    const startOffset = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
    return cells;
  }
  function changeMonth(delta) {
    const next = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + delta, 1);
    const floor = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    if (next < floor) return;
    if (next > new Date(maxDate.getFullYear(), maxDate.getMonth(), 1)) return;
    setViewMonth(next);
  }
  const monthLabel = `${viewMonth.getFullYear()}년 ${viewMonth.getMonth() + 1}월`;

  return (
    <div>
      <div style={styles.calendarHead}>
        <button style={styles.navBtn} onClick={() => changeMonth(-1)} aria-label="이전 달">‹</button>
        <div style={styles.monthLabel}>{monthLabel}</div>
        <button style={styles.navBtn} onClick={() => changeMonth(1)} aria-label="다음 달">›</button>
      </div>
      <div style={styles.weekRow}>
        {WEEKDAY_LABEL.map((w, i) => (
          <div key={w} style={{ ...styles.weekLabel, color: i === 0 || i === 6 ? "#C7BFAE" : "#8A8478" }}>{w}</div>
        ))}
      </div>
      <div style={styles.grid}>
        {buildCalendarCells().map((d, i) => {
          if (!d) return <div key={i} />;
          const selectable = isSelectableDay(d);
          const isSelected = selectedDate && dateKey(d) === dateKey(selectedDate);
          return (
            <button key={i} disabled={!selectable} onClick={() => onSelectDate(d)}
              style={{ ...styles.dayCell, ...(selectable ? {} : styles.dayCellDisabled), ...(isSelected ? styles.dayCellSelected : {}) }}>
              {d.getDate()}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function FieldLabel({ text }) {
  return <div style={styles.fieldLabel}>{text}</div>;
}

function App() {
  const [mode, setMode] = useState("parent"); // parent | adminGate | admin
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const maxDate = new Date(today); maxDate.setMonth(maxDate.getMonth() + 2);

  // ---------------- 학부모 ----------------
  const [step, setStep] = useState(1);
  const [childName, setChildName] = useState("");
  const [parentPhone, setParentPhone] = useState("");
  const [errors, setErrors] = useState({});
  const [viewMonth, setViewMonth] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const [selectedDate, setSelectedDate] = useState(null);
  const [selectedHour, setSelectedHour] = useState(null);
  const [avail, setAvail] = useState({ bookedHours: [], closedHours: [] });
  const [loadingSlots, setLoadingSlots] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");
  const [stampVisible, setStampVisible] = useState(false);

  const loadAvail = useCallback(async (date) => {
    setLoadingSlots(true);
    const result = await fetchAvailability(dateKey(date));
    setAvail(result);
    setLoadingSlots(false);
  }, []);

  useEffect(() => { if (selectedDate && mode === "parent") loadAvail(selectedDate); }, [selectedDate, mode, loadAvail]);

  function validateStep1() {
    const e = {};
    if (!childName.trim()) e.childName = "자녀 이름을 입력해주세요.";
    const digits = parentPhone.replace(/[^0-9]/g, "");
    if (!digits) e.parentPhone = "학부모 연락처를 입력해주세요.";
    else if (digits.length < 9 || digits.length > 11) e.parentPhone = "연락처 자리수를 확인해주세요.";
    setErrors(e);
    return Object.keys(e).length === 0;
  }
  function formatPhone(v) {
    const d = v.replace(/[^0-9]/g, "").slice(0, 11);
    if (d.length < 4) return d;
    if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
    return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
  }

  async function handleConfirmBooking() {
    if (!selectedDate || selectedHour == null) return;
    setSubmitting(true);
    setSubmitError("");
    const { error } = await supabase.from("bookings").insert({
      date: dateKey(selectedDate),
      hour: selectedHour,
      child_name: childName.trim(),
      parent_phone: parentPhone,
    });
    if (error) {
      if (error.code === "23505") {
        setSubmitError("방금 다른 학부모가 예약한 시간이에요. 다른 시간을 선택해주세요.");
        loadAvail(selectedDate);
        setSelectedHour(null);
      } else {
        setSubmitError("예약 저장에 실패했어요. 잠시 후 다시 시도해주세요.");
      }
      setSubmitting(false);
      return;
    }
    setSubmitting(false);
    setStep(4);
    setTimeout(() => setStampVisible(true), 300);
  }

  function resetAll() {
    setStep(1); setChildName(""); setParentPhone("");
    setSelectedDate(null); setSelectedHour(null);
    setAvail({ bookedHours: [], closedHours: [] }); setStampVisible(false); setSubmitError("");
  }

  // ---------------- 관리자 ----------------
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [authError, setAuthError] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [adminViewMonth, setAdminViewMonth] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const [adminSelectedDate, setAdminSelectedDate] = useState(null);
  const [adminBookings, setAdminBookings] = useState([]);
  const [adminClosed, setAdminClosed] = useState([]);
  const [loadingAdmin, setLoadingAdmin] = useState(false);
  const [adminBusyHour, setAdminBusyHour] = useState(null);
  const [cancelTarget, setCancelTarget] = useState(null);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => { if (data.session) setMode("admin"); });
  }, []);

  async function loadAdminDay(date) {
    setLoadingAdmin(true);
    const dKey = dateKey(date);
    const [{ data: bookings }, { data: closed }] = await Promise.all([
      supabase.from("bookings").select("hour, child_name, parent_phone").eq("date", dKey),
      supabase.from("closed_slots").select("hour").eq("date", dKey),
    ]);
    setAdminBookings(bookings || []);
    setAdminClosed((closed || []).map((r) => r.hour));
    setLoadingAdmin(false);
  }
  useEffect(() => { if (adminSelectedDate && mode === "admin") loadAdminDay(adminSelectedDate); }, [adminSelectedDate, mode]);

  async function handleLogin() {
    setAuthLoading(true); setAuthError("");
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    setAuthLoading(false);
    if (error) { setAuthError("로그인에 실패했어요. 이메일/비밀번호를 확인해주세요."); return; }
    setEmail(""); setPassword(""); setMode("admin");
  }
  async function handleLogout() {
    await supabase.auth.signOut();
    setAdminSelectedDate(null); setMode("parent");
  }

  async function toggleClosed(hour) {
    setAdminBusyHour(hour);
    const dKey = dateKey(adminSelectedDate);
    if (adminClosed.includes(hour)) {
      await supabase.from("closed_slots").delete().eq("date", dKey).eq("hour", hour);
    } else {
      await supabase.from("closed_slots").insert({ date: dKey, hour });
    }
    await loadAdminDay(adminSelectedDate);
    setAdminBusyHour(null);
  }
  async function cancelBooking(hour) {
    setAdminBusyHour(hour);
    const dKey = dateKey(adminSelectedDate);
    await supabase.from("bookings").delete().eq("date", dKey).eq("hour", hour);
    await loadAdminDay(adminSelectedDate);
    setAdminBusyHour(null); setCancelTarget(null);
  }
  async function bulkSetDay(closeAll) {
    setAdminBusyHour("bulk");
    const dKey = dateKey(adminSelectedDate);
    const bookedHours = adminBookings.map((b) => b.hour);
    if (closeAll) {
      const toClose = AVAILABLE_HOURS.filter((h) => !bookedHours.includes(h) && !adminClosed.includes(h));
      if (toClose.length) await supabase.from("closed_slots").insert(toClose.map((h) => ({ date: dKey, hour: h })));
    } else {
      await supabase.from("closed_slots").delete().eq("date", dKey);
    }
    await loadAdminDay(adminSelectedDate);
    setAdminBusyHour(null);
  }

  return (
    <div style={styles.page}>
      <div style={{ width: "100%", maxWidth: 420 }}>
        <div style={styles.card}>

          {mode === "parent" && (
            <>
              <div style={styles.header}>
                <div style={styles.crest}>
                  <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
                    <path d="M17 2 L30 9 V19 C30 26 24 30.5 17 32 C10 30.5 4 26 4 19 V9 Z" stroke="#F7F4ED" strokeWidth="1.6" fill="none" />
                    <path d="M17 9 L22 12.5 V19 C22 22 20 24.3 17 25.3 C14 24.3 12 22 12 19 V12.5 Z" fill="#F7F4ED" />
                  </svg>
                </div>
                <div>
                  <div style={styles.headerEyebrow}>학부모 상담 신청서</div>
                  <div style={styles.headerTitle}>2학기 담임 상담 예약</div>
                </div>
              </div>

              <div style={styles.progressRow}>
                {["학부모 정보", "상담 날짜", "상담 시간"].map((label, i) => {
                  const idx = i + 1;
                  const state = step > idx || step === 4 ? "done" : step === idx ? "active" : "todo";
                  return (
                    <React.Fragment key={label}>
                      <div style={styles.progressItem}>
                        <div style={{ ...styles.progressDot, ...(state === "done" ? styles.progressDotDone : state === "active" ? styles.progressDotActive : styles.progressDotTodo) }}>
                          {state === "done" ? "✓" : idx}
                        </div>
                        <div style={{ ...styles.progressLabel, color: state === "todo" ? "#B5AC9A" : "#3A3226", fontWeight: state === "active" ? 700 : 500 }}>{label}</div>
                      </div>
                      {idx < 3 && <div style={styles.progressLine} />}
                    </React.Fragment>
                  );
                })}
              </div>

              <div style={styles.body}>
                {step === 1 && (
                  <div>
                    <FieldLabel text="자녀 이름" />
                    <input style={{ ...styles.input, ...(errors.childName ? styles.inputError : {}) }} placeholder="예) 김민준" value={childName} onChange={(e) => setChildName(e.target.value)} />
                    {errors.childName && <div style={styles.errorText}>{errors.childName}</div>}
                    <div style={{ height: 18 }} />
                    <FieldLabel text="학부모 연락처" />
                    <input style={{ ...styles.input, ...(errors.parentPhone ? styles.inputError : {}) }} placeholder="010-0000-0000" value={parentPhone} onChange={(e) => setParentPhone(formatPhone(e.target.value))} inputMode="numeric" />
                    {errors.parentPhone && <div style={styles.errorText}>{errors.parentPhone}</div>}
                    <button style={{ ...styles.primaryBtn, marginTop: 26 }} onClick={() => validateStep1() && setStep(2)}>다음 · 날짜 선택</button>
                  </div>
                )}

                {step === 2 && (
                  <div>
                    <MiniCalendar viewMonth={viewMonth} setViewMonth={setViewMonth} selectedDate={selectedDate}
                      onSelectDate={(d) => { setSelectedDate(d); setSelectedHour(null); }} minDate={today} maxDate={maxDate} />
                    <div style={styles.legendRow}><span style={styles.legendDot} /> 평일만 선택 가능 · 주말·공휴일 제외</div>
                    <div style={styles.footerBtnRow}>
                      <button style={styles.ghostBtn} onClick={() => setStep(1)}>이전</button>
                      <button style={{ ...styles.primaryBtn, opacity: selectedDate ? 1 : 0.4 }} disabled={!selectedDate} onClick={() => setStep(3)}>다음 · 시간 선택</button>
                    </div>
                  </div>
                )}

                {step === 3 && (
                  <div>
                    <div style={styles.selectedDateBanner}>
                      {selectedDate?.getFullYear()}년 {selectedDate ? selectedDate.getMonth() + 1 : ""}월 {selectedDate?.getDate()}일 ({WEEKDAY_LABEL[selectedDate?.getDay() ?? 0]})
                    </div>
                    {loadingSlots ? (
                      <div style={styles.loadingBox}>예약 현황 확인 중...</div>
                    ) : avail.error ? (
                      <div style={styles.errorBanner}>예약 현황을 불러오지 못했어요. 새로고침 후 다시 시도해주세요.</div>
                    ) : (
                      <div style={styles.hourGrid}>
                        {AVAILABLE_HOURS.map((h) => {
                          const isBooked = avail.bookedHours.includes(h);
                          const isClosed = avail.closedHours.includes(h);
                          const isBlocked = isBooked || isClosed;
                          const isSelected = selectedHour === h;
                          return (
                            <button key={h} disabled={isBlocked} onClick={() => setSelectedHour(h)}
                              style={{ ...styles.hourCell, ...(isBlocked ? styles.hourCellBooked : {}), ...(isSelected ? styles.hourCellSelected : {}) }}>
                              <div style={{ fontWeight: 700 }}>{timeLabel(h)}</div>
                              <div style={{ fontSize: 11, marginTop: 3, opacity: 0.75 }}>{isBooked ? "예약 마감" : isClosed ? "상담 불가" : "예약 가능"}</div>
                            </button>
                          );
                        })}
                      </div>
                    )}
                    <div style={styles.lunchNote}>점심시간(11:00~13:00)에는 상담을 진행하지 않아요.</div>
                    {submitError && <div style={styles.errorBanner}>{submitError}</div>}
                    <div style={styles.footerBtnRow}>
                      <button style={styles.ghostBtn} onClick={() => setStep(2)}>이전</button>
                      <button style={{ ...styles.primaryBtn, opacity: selectedHour != null && !submitting ? 1 : 0.4 }} disabled={selectedHour == null || submitting} onClick={handleConfirmBooking}>
                        {submitting ? "예약 처리 중..." : "상담 예약 확정"}
                      </button>
                    </div>
                  </div>
                )}

                {step === 4 && (
                  <div style={styles.doneWrap}>
                    <div style={styles.receipt}>
                      <div style={styles.receiptRow}><span style={styles.receiptLabel}>자녀 이름</span><span style={styles.receiptValue}>{childName}</span></div>
                      <div style={styles.receiptRow}><span style={styles.receiptLabel}>학부모 연락처</span><span style={styles.receiptValue}>{parentPhone}</span></div>
                      <div style={styles.receiptRow}><span style={styles.receiptLabel}>상담 일자</span><span style={styles.receiptValue}>{selectedDate?.getFullYear()}.{pad((selectedDate?.getMonth() ?? 0) + 1)}.{pad(selectedDate?.getDate() ?? 0)} ({WEEKDAY_LABEL[selectedDate?.getDay() ?? 0]})</span></div>
                      <div style={styles.receiptRow}><span style={styles.receiptLabel}>상담 시간</span><span style={styles.receiptValue}>{selectedHour != null ? timeLabel(selectedHour) : ""}</span></div>
                      {stampVisible && (
                        <div style={styles.stamp}>
                          <div style={styles.stampInner}><div style={{ fontSize: 12, letterSpacing: 2 }}>예약</div><div style={{ fontSize: 14, letterSpacing: 1 }}>완료</div></div>
                        </div>
                      )}
                    </div>
                    <div style={styles.doneText}>상담 예약이 접수되었어요. 학교에서 별도로 안내드릴게요.</div>
                    <button style={{ ...styles.ghostBtn, marginTop: 22 }} onClick={resetAll}>새 예약 하기</button>
                  </div>
                )}
              </div>
            </>
          )}

          {mode === "adminGate" && (
            <>
              <div style={styles.header}>
                <div style={styles.crest}>🔒</div>
                <div><div style={styles.headerEyebrow}>담임 교사 전용</div><div style={styles.headerTitle}>관리자 로그인</div></div>
              </div>
              <div style={styles.body}>
                <FieldLabel text="이메일" />
                <input style={styles.input} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="teacher@example.com" />
                <div style={{ height: 14 }} />
                <FieldLabel text="비밀번호" />
                <input style={{ ...styles.input, ...(authError ? styles.inputError : {}) }} type="password" value={password}
                  onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleLogin()} />
                {authError && <div style={styles.errorText}>{authError}</div>}
                <button style={{ ...styles.primaryBtn, marginTop: 22, opacity: authLoading ? 0.6 : 1 }} disabled={authLoading} onClick={handleLogin}>
                  {authLoading ? "로그인 중..." : "로그인"}
                </button>
                <button style={styles.linkBtn} onClick={() => setMode("parent")}>학부모 화면으로 돌아가기</button>
              </div>
            </>
          )}

          {mode === "admin" && (
            <>
              <div style={styles.header}>
                <button style={{ ...styles.navBtn, background: "rgba(247,244,237,0.12)", borderColor: "rgba(247,244,237,0.3)", color: "#F7F4ED" }} onClick={handleLogout}>←</button>
                <div><div style={styles.headerEyebrow}>담임 교사 전용</div><div style={styles.headerTitle}>상담 일정 관리</div></div>
              </div>
              <div style={styles.body}>
                <MiniCalendar viewMonth={adminViewMonth} setViewMonth={setAdminViewMonth} selectedDate={adminSelectedDate}
                  onSelectDate={(d) => setAdminSelectedDate(d)} minDate={today} maxDate={maxDate} />
                {!adminSelectedDate && <div style={{ ...styles.legendRow, marginTop: 14 }}><span style={styles.legendDot} /> 날짜를 선택하면 시간대별 설정을 할 수 있어요.</div>}
                {adminSelectedDate && (
                  <div style={{ marginTop: 20 }}>
                    <div style={styles.selectedDateBanner}>{adminSelectedDate.getFullYear()}년 {adminSelectedDate.getMonth() + 1}월 {adminSelectedDate.getDate()}일 ({WEEKDAY_LABEL[adminSelectedDate.getDay()]})</div>
                    {loadingAdmin ? <div style={styles.loadingBox}>불러오는 중...</div> : (
                      <>
                        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                          <button style={{ ...styles.smallGhostBtn, opacity: adminBusyHour === "bulk" ? 0.5 : 1 }} disabled={adminBusyHour === "bulk"} onClick={() => bulkSetDay(true)}>이 날 전체 닫기</button>
                          <button style={{ ...styles.smallGhostBtn, opacity: adminBusyHour === "bulk" ? 0.5 : 1 }} disabled={adminBusyHour === "bulk"} onClick={() => bulkSetDay(false)}>이 날 전체 열기</button>
                        </div>
                        <div style={styles.ledger}>
                          {AVAILABLE_HOURS.map((h) => {
                            const booking = adminBookings.find((b) => b.hour === h);
                            const isClosed = adminClosed.includes(h);
                            const busy = adminBusyHour === h;
                            return (
                              <div key={h} style={styles.ledgerRow}>
                                <div style={{ flex: 1 }}>
                                  <div style={{ fontWeight: 700, fontSize: 13.5 }}>{timeLabel(h)}</div>
                                  {booking ? <div style={styles.ledgerSub}>예약됨 · {booking.child_name} 학부모 ({booking.parent_phone})</div>
                                    : isClosed ? <div style={{ ...styles.ledgerSub, color: "#B5AC9A" }}>닫힘 · 상담 불가</div>
                                    : <div style={{ ...styles.ledgerSub, color: "#5E7C5E" }}>상담 가능</div>}
                                </div>
                                {booking ? (
                                  cancelTarget === h ? (
                                    <div style={{ display: "flex", gap: 6 }}>
                                      <button style={{ ...styles.dangerBtn, opacity: busy ? 0.5 : 1 }} disabled={busy} onClick={() => cancelBooking(h)}>취소 확정</button>
                                      <button style={styles.tinyIconBtn} onClick={() => setCancelTarget(null)}>✕</button>
                                    </div>
                                  ) : <button style={styles.smallGhostBtn} onClick={() => setCancelTarget(h)}>예약 취소</button>
                                ) : (
                                  <button style={{ ...styles.toggleBtn, ...(isClosed ? styles.toggleBtnClosed : styles.toggleBtnOpen), opacity: busy ? 0.5 : 1 }} disabled={busy} onClick={() => toggleClosed(h)}>
                                    {isClosed ? "열기" : "닫기"}
                                  </button>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </>
                    )}
                  </div>
                )}
              </div>
            </>
          )}
        </div>

        {mode === "parent" && <button style={styles.bottomAdminLink} onClick={() => setMode("adminGate")}>선생님이신가요? 관리자 모드</button>}
      </div>
    </div>
  );
}
