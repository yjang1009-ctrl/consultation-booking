function pad(n) { return String(n).padStart(2, "0"); }

  var out = {};
  for (var i = 0; i < arguments.length; i++) { var o = arguments[i]; for (var k in o) out[k] = o[k]; }
  return out;
}

function fetchAvailability(dKey) {
  return Promise.all([
    supabase.from("booking_slots").select("hour").eq("date", dKey),
    supabase.from("closed_slots").select("hour").eq("date", dKey)
  ]).then(function (results) {
    var bookedRes = results[0], closedRes = results[1];
    if (bookedRes.error || closedRes.error) return { bookedHours: [], closedHours: [], error: true };
    return {
      bookedHours: (bookedRes.data || []).map(function (r) { return r.hour; }),
      closedHours: (closedRes.data || []).map(function (r) { return r.hour; }),
      error: false

  });
}

function MiniCalendar(props) {
  var viewMonth = props.viewMonth, setViewMonth = props.setViewMonth, selectedDate = props.selectedDate,
      onSelectDate = props.onSelectDate, minDate = props.minDate, maxDate = props.maxDate;

  function isSelectableDay(d) {
    if (d < minDate || d > maxDate) return false;
    var day = d.getDay();

  }
  function buildCells() {
    var year = viewMonth.getFullYear(), month = viewMonth.getMonth();
    var startOffset = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < startOffset; i++) cells.push(null);
    for (var d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
    return cells;
  }
  function changeMonth(delta) {
    var next = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + delta, 1);
    var floor = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    if (next < floor) return;
    if (next > new Date(maxDate.getFullYear(), maxDate.getMonth(), 1)) return;
    setViewMonth(next);
  }
  var monthLabel = viewMonth.getFullYear() + "년 " + (viewMonth.getMonth() + 1) + "월";

  return h("div", null,
    h("div", { style: styles.calendarHead },
      h("button", { style: styles.navBtn, onClick: function () { changeMonth(-1); } }, "\u2039"),
      h("div", { style: styles.monthLabel }, monthLabel),
      h("button", { style: styles.navBtn, onClick: function () { changeMonth(1); } }, "\u203A")

    h("div", { style: styles.weekRow }, WEEKDAY_LABEL.map(function (w, i) {

      return h("button", {
        key: i, disabled: !selectable,
        onClick: function () { onSelectDate(d); },
        style: assign(styles.dayCell, selectable ? {} : styles.dayCellDisabled, isSelected ? styles.dayCellSelected : {})
      }, d.getDate());
    }))

}

}

    var adminBanner = adminSelectedDate.getFullYear() + "년 " + (adminSelectedDate.getMonth() + 1) + "월 " + adminSelectedDate.getDate() + "일 (" + WEEKDAY_LABEL[adminSelectedDate.getDay()] + ")";
    var ledgerContent;
    if (loadingAdmin) {
      ledgerContent = h("div", { style: styles.loadingBox }, "불러오는 중...");
    } else {
      ledgerContent = h(Fragment, null,
        h("div", { style: { display: "flex", gap: 8, marginBottom: 16 } },
          h("button", { style: assign(styles.smallGhostBtn, { opacity: adminBusyHour === "bulk" ? 0.5 : 1 }), disabled: adminBusyHour === "bulk", onClick: function () { bulkSetDay(true); } }, "이 날 전체 닫기"),
          h("button", { style: assign(styles.smallGhostBtn, { opacity: adminBusyHour === "bulk" ? 0.5 : 1 }), disabled: adminBusyHour === "bulk", onClick: function () { bulkSetDay(false); } }, "이 날 전체 열기")
        ),
        h("div", { style: styles.ledger }, AVAILABLE_HOURS.map(function (hr) {
          var booking = null;
          for (var i = 0; i < adminBookings.length; i++) { if (adminBookings[i].hour === hr) { booking = adminBookings[i]; break; } }
          var isClosed = adminClosed.indexOf(hr) !== -1;
          var busy = adminBusyHour === hr;
          var rightSide;
          if (booking) {
            if (cancelTarget === hr) {
              rightSide = h("div", { style: { display: "flex", gap: 6 } },
                h("button", { style: assign(styles.dangerBtn, { opacity: busy ? 0.5 : 1 }), disabled: busy, onClick: function () { cancelBooking(hr); } }, "취소 확정"),
                h("button", { style: styles.tinyIconBtn, onClick: function () { setCancelTarget(null); } }, "\u2715")
              );
            } else {
              rightSide = h("button", { style: styles.smallGhostBtn, onClick: function () { setCancelTarget(hr); } }, "예약 취소");
            }
          } else {
            rightSide = h("button", {
              style: assign(styles.toggleBtn, isClosed ? styles.toggleBtnClosed : styles.toggleBtnOpen, { opacity: busy ? 0.5 : 1 }),
              disabled: busy, onClick: function () { toggleClosed(hr); }
            }, isClosed ? "열기" : "닫기");
          }
          var subLine;
          if (booking) subLine = h("div", { style: styles.ledgerSub }, "예약됨 · " + booking.child_name + " 학부모 (" + booking.parent_phone + ")");
          else if (isClosed) subLine = h("div", { style: assign(styles.ledgerSub, { color: "#B5AC9A" }) }, "닫힘 · 상담 불가");
          else subLine = h("div", { style: assign(styles.ledgerSub, { color: "#5E7C5E" }) }, "상담 가능");
          return h("div", { key: hr, style: styles.ledgerRow },
            h("div", { style: { flex: 1 } }, h("div", { style: { fontWeight: 700, fontSize: 13.5 } }, timeLabel(hr)), subLine),
            rightSide
          );
        }))
      );
    }
    adminBody = h("div", { style: { marginTop: 20 } },
      h("div", { style: styles.selectedDateBanner }, adminBanner),
      ledgerContent
    );
  }

  var adminView = h(Fragment, null,
    h("div", { style: styles.header },
      h("button", {
        style: assign(styles.navBtn, { background: "rgba(247,244,237,0.12)", borderColor: "rgba(247,244,237,0.3)", color: "#F7F4ED" }),
        onClick: handleLogout
      }, "\u2190"),
      h("div", null, h("div", { style: styles.headerEyebrow }, "담임 교사 전용"), h("div", { style: styles.headerTitle }, "상담 일정 관리"))
    ),
    h("div", { style: styles.body },
      h(MiniCalendar, {
        viewMonth: adminViewMonth, setViewMonth: setAdminViewMonth, selectedDate: adminSelectedDate,
        onSelectDate: function (d) { setAdminSelectedDate(d); }, minDate: today, maxDate: maxDate
      }),
      !adminSelectedDate && h("div", { style: assign(styles.legendRow, { marginTop: 14 }) }, h("span", { style: styles.legendDot }), " 날짜를 선택하면 시간대별 설정을 할 수 있어요."),
      adminBody
    )
  );

  var currentView = mode === "parent" ? parentView : mode === "adminGate" ? adminGateView : adminView;

  return h("div", { style: styles.page },
    h("div", { style: { width: "100%", maxWidth: 420 } },
      h("div", { style: styles.card }, currentView),
      mode === "parent" && h("button", { style: styles.bottomAdminLink, onClick: function () { setMode("adminGate"); } }, "선생님이신가요? 관리자 모드")
    )
  );
}
